[project]
name = "recp"
authors = [{name = "Esteban Gómez", email = "esteban.gomezmellado@aalto.fi"}]
version = "0.3.0"
description = "A tool for running command line recipes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "packaging>=25.0",
    "platformdirs>=4.5.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Home = "https://www.github.com/eagomez2/recp"

[project.scripts]
"recp" = "recp.cli.main:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.1",
    "mkdocs-material>=9.7.1"
]
lint = [
    "ruff>=0.6"
]
test = [
    "pytest>=8.0",
    "jsonschema>=4.0"
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "SIM",
    "TCH",
    "UP"
]
